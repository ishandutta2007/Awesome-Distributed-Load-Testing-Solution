<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)" rx="16"/>

  <!-- Dynamic / Animated Waves and Traffic Flow Background -->
  <g opacity="0.25">
    <path d="M 0,160 Q 300,80 600,160 T 1200,160" fill="none" stroke="#38bdf8" stroke-width="4">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M 0,160 Q 300,80 600,160 T 1200,160;
                M 0,160 Q 300,240 600,160 T 1200,160;
                M 0,160 Q 300,80 600,160 T 1200,160"/>
    </path>
    <path d="M 0,200 Q 300,260 600,180 T 1200,220" fill="none" stroke="#c084fc" stroke-width="3">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M 0,200 Q 300,260 600,180 T 1200,220;
                M 0,200 Q 300,100 600,200 T 1200,180;
                M 0,200 Q 300,260 600,180 T 1200,220"/>
    </path>
    <!-- Dynamic Traffic Nodes -->
    <circle cx="200" cy="120" r="6" fill="#38bdf8">
      <animate attributeName="r" values="4;9;4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="220" r="8" fill="#818cf8">
      <animate attributeName="r" values="5;12;5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="100" r="5" fill="#c084fc">
      <animate attributeName="r" values="3;8;3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Main Card Container (Keeps text clearly visible) -->
  <rect x="60" y="40" width="1080" height="240" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="2"/>

  <!-- Foreground Header & Subtitle -->
  <g text-anchor="middle">
    <!-- Icon/Badge -->
    <text x="600" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" fill="#38bdf8" font-weight="bold">
      ⚡ 🧪 DISTRIBUTED LOAD TESTING
    </text>
    
    <!-- Title -->
    <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" fill="url(#accent)" font-weight="900" filter="url(#glow)">
      Awesome Distributed Load Testing Solution
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8" font-weight="500">
      Curated Ecosystem of Open-Source Tools & Enterprise Performance Platforms
    </text>

    <!-- Stat Pills in Banner -->
    <rect x="360" y="240" width="140" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="430" y="259" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="600">🚀 Open-Source</text>

    <rect x="530" y="240" width="140" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="600" y="259" font-family="sans-serif" font-size="12" fill="#818cf8" font-weight="600">☁️ Cloud SaaS</text>

    <rect x="700" y="240" width="140" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="770" y="259" font-family="sans-serif" font-size="12" fill="#c084fc" font-weight="600">📊 High-Scale</text>
  </g>
</svg>
